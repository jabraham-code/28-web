<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071d18">
  <meta name="description" content="Play 28, the South Indian trick-taking card game, or 13-card Indian Rummy online with friends or bots.">
  <title>28 · Twenty-Eight Online</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='4' width='44' height='56' rx='7' fill='%23fffaf0' stroke='%23e8c170' stroke-width='3'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-weight='700' font-size='26' text-anchor='middle' fill='%230f5a46'%3E28%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/cards.css">
  <link rel="stylesheet" href="/css/lobby.css">
  <link rel="stylesheet" href="/css/table.css">
  <link rel="stylesheet" href="/css/voice.css">
  <link rel="stylesheet" href="/css/extras.css">
  <link rel="stylesheet" href="/css/score.css">
  <link rel="stylesheet" href="/css/rummy.css">
</head>
<body>
  <div id="app">
    <section id="screen-landing" class="screen" aria-labelledby="landing-title">
      <div class="landing-deco" aria-hidden="true">
        <div class="deco-card c1"></div><div class="deco-card c2"></div><div class="deco-card c3"></div><div class="deco-card c4"></div>
      </div>
      <div class="landing-inner">
        <header class="landing-hero">
          <div class="hero-mark" aria-hidden="true"><span>28</span></div>
          <h1 id="landing-title">Twenty-Eight</h1>
          <p class="tagline">The classic South Indian trump game. Four players, two teams, one hidden trump. <span class="tagline-more">Or deal a hand of 13-card Rummy for 2–6.</span></p>
        </header>
        <form class="glass landing-panel" id="landing-form" novalidate>
          <label class="field">
            <span class="field-label">Your name</span>
            <input class="input" id="name-input" name="name" type="text" maxlength="20" autocomplete="nickname" placeholder="e.g. Anjali" required>
          </label>
          <div class="landing-actions">
            <button class="btn btn-gold btn-lg btn-block" type="button" id="create-btn">
              <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
              <span>Create a room</span>
            </button>
            <div class="divider"><span>or join a friend</span></div>
            <div class="join-row">
              <label class="sr-only" for="code-input">Room code</label>
              <input class="input code-input" id="code-input" name="code" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" inputmode="text">
              <button class="btn btn-outline-gold btn-lg" type="submit" id="join-btn">Join</button>
            </div>
          </div>
          <p class="landing-msg" id="landing-msg" aria-live="polite"></p>
        </form>
        <footer class="landing-foot">
          <button class="link-btn" type="button" id="landing-rules">How to play</button>
          <span aria-hidden="true">&middot;</span>
          <span class="muted">Bots fill empty seats</span>
        </footer>
      </div>
    </section>

    <section id="screen-lobby" class="screen" hidden aria-label="Lobby"></section>
    <section id="screen-game" class="screen" hidden aria-label="Game"></section>
    <section id="screen-rummy" class="screen" hidden aria-label="Rummy"></section>
  </div>

  <div id="conn-pill" class="conn-pill" role="status" aria-live="polite" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="anim-layer" aria-hidden="true"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
